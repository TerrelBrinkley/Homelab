version: "3.8"

services:
  vpn:
    image: ghcr.io/bubuntux/nordvpn:latest
    container_name: nordvpn
    cap_add:
      - NET_ADMIN                                                                    # Required for NordVPN to control network routing
      - NET_RAW                                                                      # Required for packet manipulation
    environment:
      - TOKEN=       # Paste your generated token here
      - TECHNOLOGY=NordLynx                                                          # Uses fast WireGuard-based connections
      - CONNECT=United_States                                                        # Change to your preferred country/city
      - NETWORK=xxx.xxx.xx.x.x/24                                                      # CHANGE THIS to your home router's local subnet
      - POST_CONNECT=nordvpn whitelist add subnet 192.168.86.0/24 && nordvpn whitelist add port 8080                                         # FORCE NORDVPN DAEMON TO MANUALLY BYPASS LAN & WEB PORT INSIDE IPTABLES
      - KILLSWITCH=Enable                                                            # Disconnects network immediately if VPN drops
    ports:
      - 8080:8080                                                                    # qBittorrent Web UI port exposed on the VPN container
      - 6881:6881                                                                    # Torrent incoming TCP port
      - 6881:6881/udp                                                                # Torrent incoming UDP port
    sysctls:
      - net.ipv4.ip_forward=1                                                        # Enables IP routing for the combined network
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"                                                      # Locks qBittorrent's network entirely into the VPN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - /volume1/docker/arr-stack/qbittorrent:/config
      - /mnt/nfs/plex/data/torrents:/data/torrents
    restart: unless-stopped
    depends_on:
      - vpn                                                                          # Ensures the VPN boots first

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: bridge
    ports:
      - "8989:8989"                                                                  # Exposes Sonarr Web UI
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /volume1/docker/arr-stack/sonarr/data:/config
      - /mnt/nfs/plex/data:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: bridge
    ports:
      - "9696:9696"                                                                  # Exposes Prowlarr Web UI
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /volume1/docker/arr-stack/prowlarr/data:/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: bridge
    ports:
      - "7878:7878"                                                                  # Exposes Radarr Web UI
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /volume1/docker/arr-stack/radarr/data:/config
      - /mnt/nfs/plex/data:/data
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    network_mode: bridge
    ports:
      - "5055:5055"                                                                  # Exposes Overseerr Web UI
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /volume1/docker/arr-stack/overseerr/config:/config
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: bridge
    ports:
      - "6767:6767"                                                                  # Exposes Bazarr Web UI
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /volume1/docker/arr-stack/bazarr/config:/config
      - /mnt/nfs/plex/data/media:/data/media
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
